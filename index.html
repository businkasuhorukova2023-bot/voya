<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voya | Глобальный путеводитель</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.95);
    --accent: #38bdf8; --purple: #a78bfa; --text: #f8fafc; --text-muted: #94a3b8;
  }

  body, html {
    margin: 0; padding: 0; height: 100%; font-family: 'Montserrat', sans-serif;
    background-color: var(--bg); color: var(--text); overflow: hidden;
  }

  /* СТАРТОВЫЙ ЭКРАН */
  #splash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1600&q=80') center/cover no-repeat;
    z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.8s ease;
  }
  .splash-logo {
    font-size: 64px; font-weight: 800; letter-spacing: 6px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(56, 189, 248, 0.4); margin: 0;
  }
  .splash-sub { font-size: 16px; color: #cbd5e1; margin-top: 10px; margin-bottom: 40px; letter-spacing: 2px; }
  .btn-start {
    background: linear-gradient(90deg, var(--accent), var(--purple));
    color: #000; font-size: 18px; font-weight: 800; text-transform: uppercase;
    padding: 18px 40px; border-radius: 30px; border: none; cursor: pointer;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.5); transition: 0.3s;
  }
  .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); }

  /* ШАПКА С ПОИСКОМ */
  header {
    position: absolute; top: 0; left: 0; width: 100%;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    padding: 10px 15px; z-index: 1000;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    box-sizing: border-box; border-bottom: 1px solid rgba(56, 189, 248, 0.15);
  }
  .logo { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 2px; color: #fff; }
  
  .search-box {
    flex-grow: 1; max-width: 300px; position: relative;
  }
  .search-box input {
    width: 100%; padding: 8px 12px; border-radius: 20px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--accent);
    color: #fff; font-family: 'Montserrat', sans-serif; outline: none;
  }
  .search-box input::placeholder { color: #94a3b8; }

  .btn-geo {
    background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent);
    color: var(--accent); padding: 8px; border-radius: 50%; width: 36px; height: 36px;
    cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; font-size: 16px;
  }
  .btn-geo:hover { background: var(--accent); color: #000; }

  #map { width: 100%; height: 100vh; background: #1e293b; z-index: 1; }
  .leaflet-control-attribution { display: none !important; }

  /* КАРТОЧКИ */
  .custom-popup .leaflet-popup-content-wrapper {
    background: var(--card-bg); color: var(--text); border-radius: 16px;
    border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    padding: 0; overflow: hidden;
  }
  .custom-popup .leaflet-popup-content { margin: 0; width: 260px !important; }
  .custom-popup .leaflet-popup-tip { background: var(--card-bg); }
  .custom-popup .leaflet-popup-close-button { color: #fff; font-size: 20px; padding: 5px 10px; }
  .popup-img { width: 100%; height: 140px; object-fit: cover; border-bottom: 2px solid rgba(56, 189, 248, 0.2); }
  .popup-content { padding: 14px; }
  .popup-title { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; color: #fff; }
  .popup-country { font-size: 10px; color: var(--purple); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
  .popup-desc { margin: 0 0 10px 0; font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  .price-box {
    display: flex; justify-content: space-between; background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.15); padding: 8px; border-radius: 8px; margin-bottom: 10px;
  }
  .price-label { font-size: 10px; color: var(--text-muted); }
  .price-value { font-size: 13px; font-weight: 700; color: var(--accent); }
  .btn-route {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    color: #000; border: none; padding: 10px; border-radius: 8px;
    font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 800;
    cursor: pointer; text-transform: uppercase; transition: 0.3s; box-sizing: border-box;
  }
  .btn-route:hover { box-shadow: 0 0 15px rgba(56, 189, 248, 0.6); transform: translateY(-2px); }
</style>
</head>
<body>

<div id="splash-screen">
  <h1 class="splash-logo">VOYA</h1>
  <p class="splash-sub">МИР У ТВОИХ НОГ</p>
  <button class="btn-start" onclick="startApp()">Исследовать планету</button>

  // Функция для поиска правильной картинки
  function getImg(id) {
    return `https://images.unsplash.com/photo-${id}?w=400&q=80`;
  }

  // Генерация точек на карте
  const markers = []; // Массив для хранения всех маркеров (для поиска)

  db.forEach(loc => {
    const name = loc[0], country = loc[1], lat = loc[2], lng = loc[3], img = getImg(loc[4]), desc = loc[5], price = loc[6];
    const routeUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

    const popupContent = `
      <div>
        <img src="${img}" class="popup-img" alt="${name}">
        <div class="popup-content">
          <span class="popup-country">${country}</span>
          <h3 class="popup-title">${name}</h3>
          <p class="popup-desc">${desc}</p>
          <div class="price-box">
            <span class="price-label">Отели:</span>
            <span class="price-value">${price} ₽</span>
          </div>
          <a href="${routeUrl}" target="_blank" class="btn-route">Построить маршрут</a>
        </div>
      </div>
    `;

    const marker = L.marker([lat, lng], {icon: customIcon}).addTo(map).bindPopup(popupContent, { className: 'custom-popup', maxWidth: 260, minWidth: 260 });
    
    // Сохраняем маркер для функции поиска
    markers.push({ name: name.toLowerCase(), marker: marker, lat: lat, lng: lng });
  });

  // Рисуем линию Кавказского маршрута
  const routePoints = [
    [44.20, 43.13], [44.04, 43.05], [43.90, 42.71], [43.68, 42.47], [43.35, 42.44]
  ];
  L.polyline(routePoints, { color: '#a78bfa', weight: 4, opacity: 0.8, dashArray: '10, 10', lineJoin: 'round' }).addTo(map);

  // --- ФУНКЦИИ ПРИЛОЖЕНИЯ ---

  function startApp() {
    const splash = document.getElementById('splash-screen');
    splash.style.opacity = '0';
    setTimeout(() => { splash.style.display = 'none'; map.invalidateSize(); }, 800);
    findMe(); // Сразу ищем пользователя
  }

  // Геолокация (Я здесь)
  function findMe() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          map.setView([lat, lng], 10);
          
          L.marker([lat, lng], {icon: myIcon}).addTo(map)
            .bindPopup("<b>Вы здесь!</b><br>Начало вашего путешествия.")
            .openPopup();
        },
        () => { map.setView([20, 0], 2); }
      );
    }
  }

  // Поиск по городам
  function handleSearch(event) {
    if (event.key === 'Enter') {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) return;

      // Ищем город в нашей базе
      const found = markers.find(m => m.name.includes(query));

      if (found) {
        // Плавно летим к найденному городу и открываем его карточку
        map.flyTo([found.lat, found.lng], 12, { duration: 2 });
        setTimeout(() => { found.marker.openPopup(); }, 2100); // Ждем окончания полета и открываем
      } else {
        alert('Город не найден в базе. Попробуйте: Париж, Токио, Сочи...');
      }
    }
  }
</script>
</body>
</html>
