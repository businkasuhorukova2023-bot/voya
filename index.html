<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voya | Мир У Твоих Ног</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --primary: #FF5E62; 
            --secondary: #2C3E50; 
            --light: #FDFBF7; 
            --dark-space: #0f2027;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--light); overflow: hidden; height: 100vh; width: 100vw; touch-action: manipulation; }

        /* --- SPLASH SCREEN (PURE CSS EARTH) --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #1a2a6c 0%, #000000 100%);
            transition: opacity 0.8s ease-out;
        }

        .earth-css {
            width: 200px; height: 200px;
            border-radius: 50%;
            /* Рисуем материки градиентами - это никогда не сломается */
            background: 
                radial-gradient(circle at 30% 30%, #2ecc71 20%, transparent 21%),
                radial-gradient(circle at 70% 60%, #27ae60 25%, transparent 26%),
                radial-gradient(circle at 50% 80%, #f1c40f 15%, transparent 16%),
                linear-gradient(135deg, #2980b9 0%, #6dd5fa 100%);
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(0, 150, 255, 0.5);
            animation: spinEarth 20s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spinEarth { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        h1 { color: white; font-size: 3rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,255,255,0.5);}
        p.subtitle { color: #aaa; font-size: 1.2rem; margin-bottom: 40px; }

        button.start-btn {
            padding: 15px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 94, 98, 0.4);
            transition: transform 0.2s;
        }
        button.start-btn:hover { transform: scale(1.05); }

        /* --- MAIN APP --- */
        #app-interface { display: none; width: 100%; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Hide Leaflet Logo/Attribution */
        .leaflet-control-attribution, .leaflet-control-logo { display: none !important; }

        /* Top Controls */
        .top-controls {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px;
            z-index: 1000;
            display: flex; gap: 10px;
        }

        .search-input {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 1rem;
            outline: none;
        }

        .dice-btn {
            width: 45px; height: 45px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
        }
        .dice-btn:active { transform: scale(0.9); }

        /* Popup Design */
        .custom-popup {
            padding: 15px;
            background: white;
            border-radius: 10px;
            min-width: 250px;
        }
        .popup-city { font-size: 1.4rem; font-weight: bold; color: var(--secondary); margin-bottom: 5px; }
        .popup-country { font-size: 0.9rem; color: #888; margin-bottom: 15px; }
        .popup-btn {
            display: block; width: 100%;
            background: var(--primary); color: white;
            text-align: center; padding: 10px;
            border-radius: 8px; text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="earth-css"></div>
        <h1>VOYA</h1>
        <p class="subtitle">Открой мир для себя</p>
        <button class="start-btn" onclick="enterApp()">НАЧАТЬ ПУТЕШЕСТВИЕ</button>
    </div>

    <!-- MAIN APP -->
    <div id="app-interface">
        <div id="map"></div>
        
        <div class="top-controls">
            <input type="text" class="search-input" placeholder="Поиск города..." onkeyup="handleSearch(event)">
            <button class="dice-btn" onclick="randomDestination()" title="Куда судьба?">🎲</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // База данных городов (только то, что точно есть)
        const cities = [
            { name: "Москва", country: "Россия", lat: 55.75, lng: 37.61 },
            { name: "Санкт-Петербург", country: "Россия", lat: 59.93, lng: 30.33 },
            { name: "Сочи", country: "Россия", lat: 43.60, lng: 39.73 },
            { name: "Новороссийск", country: "Россия", lat: 44.72, lng: 37.77 },
            { name: "Владивосток", country: "Россия", lat: 43.11, lng: 131.88 },
            { name: "Казань", country: "Россия", lat: 55.79, lng: 49.12 },
            { name: "Париж", country: "Франция", lat: 48.85, lng: 2.35 },
            { name: "Лондон", country: "Англия", lat: 51.50, lng: -0.12 },
            { name: "Нью-Йорк", country: "США", lat: 40.71, lng: -74.00 },
            { name: "Токио", country: "Япония", lat: 35.68, lng: 139.69 },
            { name: "Дубай", country: "ОАЭ", lat: 25.20, lng: 55.27 },
            { name: "Рим", country: "Италия", lat: 41.90, lng: 12.49 }
        ];

        let map, markersLayer;

        function enterApp() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-interface').style.display = 'block';
                initMap();
            }, 800);
        }

        function initMap() {
            map = L.map('map').setView([20, 0], 2);
            
            // Стандартная карта OpenStreetMap (всегда работает)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '' 
            }).addTo(map);

            renderMarkers(cities);
        }

        function renderMarkers(dataList) {
            if(markersLayer) map.removeLayer(markersLayer);
            markersLayer = L.layerGroup().addTo(map);

            dataList.forEach(city => {
                // Красный маркер по умолчанию
                const marker = L.marker([city.lat, city.lng]).addTo(markersLayer);
                
                // Создаем попап
                const popupContent = `
                    <div class="custom-popup">
                        <div class="popup-city">${city.name}</div>
                        <div class="popup-country">${city.country}</div>
                        <a href="#" onclick="buildRoute(${city.lat}, ${city.lng}); return false;" class="popup-btn">Построить маршрут</a>
                    </div>
                `;
                
                marker.bindPopup(popupContent, { maxWidth: 300 });
            });
        }

        function buildRoute(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }

        function randomDestination() {
            const randomIndex = Math.floor(Math.random() * cities.length);
            const targetCity = cities[randomIndex];
            
            // Вибрация телефона (если поддерживает)
            if(navigator.vibrate) navigator.vibrate(50);

            map.flyTo([targetCity.lat, targetCity.lng], 8, { duration: 2 });
            
            // Открыть попап через секунду после перелета
            setTimeout(() => {
                markersLayer.eachLayer(layer => {
                    if(layer.getLatLng().lat === targetCity.lat && layer.getLatLng().lng === targetCity.lng) {
                        layer.openPopup();
                    }
                });
            }, 2000);
        }

        function handleSearch(e) {
            if(e.key === 'Enter') {
                const query = e.target.value.toLowerCase().trim();
                if(!query) return renderMarkers(cities);

                const filtered = cities.filter(c => c.name.toLowerCase().includes(query));
                renderMarkers(filtered);
                
                if(filtered.length > 0) {
                     const first = filtered[0];
                     map.flyTo([first.lat, first.lng], 10);
                } else {
                    alert("Город не найден.");
                }
            }
        }
    </script>
</body>
</html>
