<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voya | Мир У Твоих Ног</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { overflow: hidden; height: 100vh; width: 100vw; background: #000; }

        /* ===== ЗАСТАВКА ===== */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #1a2a6c 0%, #0a0a2e 70%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease;
        }

        .earth {
            width: 220px; height: 220px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, #4a90e2 0%, #2c5aa0 40%, #1a3d6e 70%, #0d1f3d 100%);
            box-shadow: 
                inset -20px -20px 50px rgba(0,0,0,0.8),
                inset 10px 10px 30px rgba(100,180,255,0.3),
                0 0 60px rgba(74,144,226,0.5),
                0 0 100px rgba(74,144,226,0.3);
            position: relative;
            animation: rotate 20s linear infinite;
            overflow: hidden;
        }

        /* Материки через градиенты */
        .earth::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: 
                radial-gradient(ellipse 40% 30% at 25% 35%, #2d5016 0%, transparent 70%),
                radial-gradient(ellipse 30% 40% at 60% 40%, #3d6b1f 0%, transparent 70%),
                radial-gradient(ellipse 35% 25% at 70% 65%, #4a7c23 0%, transparent 70%),
                radial-gradient(ellipse 25% 35% at 35% 70%, #2d5016 0%, transparent 70%),
                radial-gradient(ellipse 20% 20% at 80% 30%, #3d6b1f 0%, transparent 70%);
            opacity: 0.8;
        }

        /* Облака */
        .earth::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: 
                radial-gradient(ellipse 50% 15% at 40% 25%, rgba(255,255,255,0.4) 0%, transparent 70%),
                radial-gradient(ellipse 40% 10% at 65% 55%, rgba(255,255,255,0.3) 0%, transparent 70%);
        }

        @keyframes rotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .logo {
            font-size: 3.5rem; font-weight: 900; color: white;
            letter-spacing: 8px; margin-top: 40px;
            text-shadow: 0 0 30px rgba(100,180,255,0.8);
        }

        .tagline {
            color: #8ab4f8; font-size: 1.1rem; margin-top: 10px;
            letter-spacing: 2px;
        }

        .start-btn {
            margin-top: 50px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #FF5E62 0%, #FF9966 100%);
            color: white; border: none; border-radius: 50px;
            font-size: 1.2rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(255,94,98,0.6);
            transition: all 0.3s ease;
        }

        .start-btn:active { transform: scale(0.95); }

        /* ===== КАРТА ===== */
        #app { display: none; width: 100%; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }
        .leaflet-control-attribution { display: none !important; }

        /* ===== ПОИСК (БОЛЬШОЙ, ДЛЯ ТЕЛЕФОНА) ===== */
        .search-box {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            width: 92%; max-width: 500px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            padding: 8px;
            display: flex;
            gap: 8px;
            z-index: 1000;
        }

        .search-input {
            flex: 1;
            border: none; outline: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 25px;
            background: #f5f5f5;
        }

        .search-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #FF5E62 0%, #FF9966 100%);
            color: white; border: none; border-radius: 25px;
            font-size: 1rem; font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-btn:active { transform: scale(0.95); }

        /* ===== ПОПАП ГОРОДА ===== */
        .city-card {
            text-align: center; padding: 15px; min-width: 220px;
        }
        .city-card h2 { font-size: 1.4rem; color: #2C3E50; margin-bottom: 5px; }
        .city-card p { font-size: 0.9rem; color: #666; margin-bottom: 15px; }
        .route-btn {
            display: block; width: 100%;
            padding: 12px;
            background: #2C3E50; color: white;
            border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600;
            cursor: pointer;
        }
        .route-btn:active { background: #FF5E62; }
    </style>
</head>
<body>

    <!-- ЗАСТАВКА -->
    <div id="splash">
        <div class="earth"></div>
        <div class="logo">VOYA</div>
        <div class="tagline">МИР У ТВОИХ НОГ</div>
        <button class="start-btn" onclick="startApp()">НАЧАТЬ ПУТЕШЕСТВИЕ</button>
    </div>

    <!-- ПРИЛОЖЕНИЕ -->
    <div id="app">
        <div id="map"></div>
        
        <div class="search-box">
            <input type="text" class="search-input" id="cityInput" placeholder="Введите город...">
            <button class="search-btn" onclick="findCity()">🔍 НАЙТИ</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, currentMarker;

        function startApp() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                initMap();
            }, 1000);
        }

        function initMap() {
            map = L.map('map').setView([55.7558, 37.6173], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: ''
            }).addTo(map);
        }

        function findCity() {
            const query = document.getElementById('cityInput').value.trim();
            if (query.length < 2) {
                alert('Введите название города (минимум 2 буквы)');
                return;
            }

            // Используем Nominatim API для поиска любого города мира
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&accept-language=ru`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const city = data[0];
                        const lat = parseFloat(city.lat);
                        const lng = parseFloat(city.lon);
                        const name = city.display_name.split(',')[0];
                        const country = city.display_name.split(',').slice(-2,-1)[0] || '';

                        if (currentMarker) map.removeLayer(currentMarker);
                        
                        currentMarker = L.marker([lat, lng]).addTo(map);
                        
                        const popupContent = `
                            <div class="city-card">
                                <h2>${name}</h2>
                                <p>${country}</p>
                                <button class="route-btn" onclick="buildRoute(${lat}, ${lng})">🚗 ПОСТРОИТЬ МАРШРУТ</button>
                            </div>
                        `;
                        
                        currentMarker.bindPopup(popupContent, { maxWidth: 300 }).openPopup();
                        map.flyTo([lat, lng], 12, { duration: 2 });
                    } else {
                        alert('Город "' + query + '" не найден. Попробуйте другое название.');
                    }
                })
                .catch(error => {
                    alert('Ошибка поиска. Проверьте интернет.');
                });
        }

        function buildRoute(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }

        // Enter в поле поиска
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('cityInput');
            if (input) {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') findCity();
                });
            }
        });
    </script>
</body>
</html>
