<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voya | Цветная Карта</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { overflow: hidden; height: 100vh; width: 100vw; }
        
        #map { width: 100%; height: 100%; }
        
        /* Скрываем атрибуты карты */
        .leaflet-control-attribution { display: none !important; }
        
        /* Поисковая строка - ВНИЗУ, не мешает кнопкам зума */
        .search-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            z-index: 1000;
            background: white;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-icon { font-size: 1.2rem; }
        
        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #333;
        }
        
        /* Попап города */
        .city-popup {
            text-align: center;
            padding: 10px;
        }
        .city-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .city-country { font-size: 0.9rem; color: #666; margin-bottom: 10px; }
        .btn-route {
            background: #2C3E50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-route:hover { background: #FF5E62; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <!-- Поиск внизу -->
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="citySearch" placeholder="Найти город (например, Геленджик)...">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // База городов
        const cities = [
            { name: "Москва", country: "Россия", lat: 55.7558, lng: 37.6173 },
            { name: "Санкт-Петербург", country: "Россия", lat: 59.9343, lng: 30.3351 },
            { name: "Сочи", country: "Россия", lat: 43.6028, lng: 39.7342 },
            { name: "Новороссийск", country: "Россия", lat: 44.7230, lng: 37.7686 },
            { name: "Геленджик", country: "Россия", lat: 44.5619, lng: 38.0769 },
            { name: "Ростов-на-Дону", country: "Россия", lat: 47.2357, lng: 39.7015 },
            { name: "Грозный", country: "Россия", lat: 43.3180, lng: 45.6986 },
            { name: "Казань", country: "Россия", lat: 55.7887, lng: 49.1221 },
            { name: "Владивосток", country: "Россия", lat: 43.1155, lng: 131.8855 },
            { name: "Париж", country: "Франция", lat: 48.8566, lng: 2.3522 },
            { name: "Лондон", country: "Великобритания", lat: 51.5074, lng: -0.1278 },
            { name: "Нью-Йорк", country: "США", lat: 40.7128, lng: -74.0060 },
            { name: "Токио", country: "Япония", lat: 35.6762, lng: 139.6503 },
            { name: "Дубай", country: "ОАЭ", lat: 25.2048, lng: 55.2708 },
            { name: "Рим", country: "Италия", lat: 41.9028, lng: 12.4964 },
            { name: "Барселона", country: "Испания", lat: 41.3851, lng: 2.1734 }
        ];

        // Инициализация карты - ЦВЕТНАЯ OpenStreetMap
        const map = L.map('map').setView([20, 0], 2);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: ''
        }).addTo(map);

        let currentMarker = null;

        // Функция поиска - работает сразу при вводе
        document.getElementById('citySearch').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            
            if (query.length < 2) {
                // Если стерли текст - убираем маркер
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                    currentMarker = null;
                }
                return;
            }

            const found = cities.find(c => c.name.toLowerCase().includes(query));
            
            if (found) {
                // Удаляем старый маркер
                if (currentMarker) map.removeLayer(currentMarker);
                
                // Добавляем новый
                currentMarker = L.marker([found.lat, found.lng]).addTo(map);
                
                const popupContent = `
                    <div class="city-popup">
                        <div class="city-name">${found.name}</div>
                        <div class="city-country">${found.country}</div>
                        <button class="btn-route" onclick="buildRoute(${found.lat}, ${found.lng})">🚗 Маршрут</button>
                    </div>
                `;
                
                currentMarker.bindPopup(popupContent).openPopup();
                
                // Плавно летим к городу
                map.flyTo([found.lat, found.lng], 10, { duration: 1.5 });
            }
        });

        function buildRoute(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }
    </script>
</body>
</html>
