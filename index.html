<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voya | Мир У Твоих Ног</title>
    <meta name="theme-color" content="#02040a">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { overflow: hidden; height: 100vh; width: 100vw; background: #02040a; }

        /* ЗАСТАВКА С ГЛОБУСОМ (БЕЗ ЛИШНИХ ЛИНИЙ) */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #02040a; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease;
        }

        #globe-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        .splash-content {
            position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
        }

        .logo { font-size: 3.5rem; font-weight: 900; color: white; letter-spacing: 8px; text-shadow: 0 0 30px rgba(0,243,255,0.8); margin-bottom: 5px; }
        .tagline { color: #38bdf8; font-size: 1.1rem; letter-spacing: 3px; margin-bottom: 40px; text-transform: uppercase; }
        
        .start-btn {
            pointer-events: auto; padding: 18px 45px; 
            background: linear-gradient(135deg, #00f3ff 0%, #bc13fe 100%);
            color: white; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 800;
            letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 30px rgba(0,243,255,0.5);
            text-transform: uppercase; transition: 0.3s;
        }
        .start-btn:active { transform: scale(0.95); }

        /* КАРТА */
        #app { display: none; width: 100%; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; background: #1e293b; }
        .leaflet-control-attribution { display: none !important; }

        /* ПОИСК (ВСЕГДА СВЕРХУ) */
        .search-box {
            position: absolute; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 500px; background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 30px; box-shadow: 0 5px 25px rgba(0,0,0,0.6);
            padding: 8px; display: flex; gap: 8px; z-index: 1000; 
            top: 20px; /* Теперь всегда сверху */
        }

        .search-input { 
            flex: 1; border: none; outline: none; padding: 12px 20px; 
            font-size: 1rem; border-radius: 25px; background: rgba(0,0,0,0.5); 
            color: #fff; min-width: 0; 
        }
        .search-input::placeholder { color: #94a3b8; }
        
        .search-btn { 
            padding: 12px 20px; background: linear-gradient(135deg, #00f3ff 0%, #bc13fe 100%); 
            color: white; border: none; border-radius: 25px; font-size: 1.3rem; cursor: pointer; flex-shrink: 0; 
        }

        /* КАРТОЧКА С ФОТО */
        .city-card { text-align: center; padding: 0; min-width: 230px; overflow: hidden; border-radius: 12px; background: #0f172a; }
        .city-img { width: 100%; height: 140px; object-fit: cover; background: #1e293b; }
        .city-info { padding: 15px; }
        .city-card h2 { font-size: 1.3rem; color: #fff; margin-bottom: 5px; }
        .city-card p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
        .route-btn { 
            display: block; width: 100%; padding: 12px; 
            background: linear-gradient(90deg, #00f3ff, #bc13fe); color: #000; 
            border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 800; 
            cursor: pointer; text-transform: uppercase; 
        }

        /* ИНДИКАТОР ЗАГРУЗКИ */
        .loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: #38bdf8; padding: 15px 25px; border-radius: 15px;
            font-size: 1rem; z-index: 2000; display: none; text-align: center;
            border: 1px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div id="splash">
        <div id="globe-container"></div>
        <div class="splash-content">
            <div class="logo">VOYA</div>
            <div class="tagline">Мир у твоих ног</div>
            <button class="start-btn" onclick="startApp()">Начать</button>
        </div>
    </div>

    <div id="app">
        <div id="map"></div>
        <div class="search-box">
            <input type="text" class="search-input" id="cityInput" placeholder="Введите город...">
            <button class="search-btn" onclick="findCity()">🔍</button>
        </div>
        <div class="loading" id="loading">⏳ Ищем...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==========================================
        // 1. 3D ГЛОБУС (ТОЛЬКО ШАР И ТОЧКИ, БЕЗ ЛИНИЙ)
        // ==========================================
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Сетка глобуса
        const geometry = new THREE.SphereGeometry(3, 40, 40);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.15
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Светящиеся точки на глобусе
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 400;
        const posArray = new Float32Array(particlesCount * 3);
        
        for(let i = 0; i < particlesCount * 3; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 3.05;
            posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i * 3 + 2] = r * Math.cos(phi);
        }
        
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.06, color: 0xbc13fe, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        camera.position.z = 8;

        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.002;
            particlesMesh.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // ==========================================
        // 2. КАРТА (С ГОРОДАМИ И УЛИЦАМИ)
        // ==========================================
        let map, currentMarker;

        function startApp() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                initMap();
            }, 800);
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([20, 0], 3);
            
            // МЕНЯЕМ СЛОЙ НА CARTO (Здесь есть и страны, и города, и улицы при зуме)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(map);

            // Кнопка "+" и "-" для зума в правом нижнем углу
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Поиск локации пользователя при старте
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { map.flyTo([pos.coords.latitude, pos.coords.longitude], 10, { duration: 2 }); }
                );
            }

            // Тап по карте для установки метки
            map.on('click', function(e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;
                showLoading(true);
                
                fetch(`https://photon.komoot.io/reverse?lon=${lng}&lat=${lat}&lang=ru`)
                    .then(r => r.json())
                    .then(data => {
                        showLoading(false);
                        let name = "Точка на карте";
                        let country = "";
                        
                        if (data.features && data.features.length > 0) {
                            const p = data.features[0].properties;
                            name = p.name || p.street || p.city || "Точка на карте";
                            country = p.country || "";
                        }
                        dropPin(lat, lng, name, country);
                    })
                    .catch(() => { 
                        showLoading(false); 
                        dropPin(lat, lng, "Точка на карте", ""); 
                    });
            });
        }

        function findCity() {
            const query = document.getElementById('cityInput').value.trim();
            if (query.length < 2) return alert('Введите город');
            
            showLoading(true);
            fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=1&lang=ru`)
                .then(r => r.json())
                .then(data => {
                    showLoading(false);
                    if (data.features && data.features.length > 0) {
                        const place = data.features[0];
                        const lat = place.geometry.coordinates[1];
                        const lng = place.geometry.coordinates[0];
                        const name = place.properties.name || query;
                        const country = place.properties.country || "";
                        
                        dropPin(lat, lng, name, country);
                        map.flyTo([lat, lng], 12, { duration: 2 });
                    } else {
                        alert('Город не найден');
                    }
                })
                .catch(() => { showLoading(false); alert('Ошибка'); });
        }

        // Функция добавления метки с фото
        function dropPin(lat, lng, name, country) {
            if (currentMarker) map.removeLayer(currentMarker);
            
            // Фото города
            const imgUrl = `https://loremflickr.com/300/200/${encodeURIComponent(name)},city/all`;

            const popupContent = `
                <div class="city-card">
                    <img src="${imgUrl}" class="city-img" onerror="this.src='https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=300&q=80'">
                    <div class="city-info">
                        <h2>${name}</h2>
                        <p>${country}</p>
                        <button class="route-btn" onclick="buildRoute(${lat}, ${lng})">🚗 МАРШРУТ</button>
                    </div>
                </div>
            `;

            currentMarker = L.marker([lat, lng]).addTo(map);
            currentMarker.bindPopup(popupContent, { maxWidth: 250, minWidth: 250 }).openPopup();
        }

        function buildRoute(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') findCity();
        });
    </script>
</body>
</html>
