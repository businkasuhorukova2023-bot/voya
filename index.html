<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voya | Мир У Твоих Ног</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF5E62; /* Коралловый */
            --secondary: #2C3E50; /* Темно-синий текст */
            --light: #FDFBF7; /* Кремовый фон */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background-color: var(--light); overflow: hidden; height: 100vh; width: 100vw; touch-action: manipulation; }

        /* --- SPLASH SCREEN (START PAGE) --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%); /* Небо */
            transition: opacity 0.8s ease-out;
        }

        .earth-container {
            position: relative;
            width: 220px; height: 220px;
            margin-bottom: 30px;
            perspective: 1000px;
        }

        .earth {
            width: 100%; height: 100%;
            border-radius: 50%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/c/c9/Earth_from_space.jpg');
            background-size: cover;
            box-shadow: inset -15px -15px 40px rgba(0,0,0,0.4), 0 15px 40px rgba(0,0,0,0.15);
            animation: rotateEarth 25s linear infinite;
        }

        @keyframes rotateEarth { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .logo-text {
            font-size: 3rem; font-weight: 700; color: var(--secondary);
            letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 40px; font-weight: 300; }

        .btn-start {
            padding: 15px 50px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem; font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 94, 98, 0.4);
            border: none;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 94, 98, 0.6);
        }

        /* --- MAIN APP INTERFACE --- */
        #app-interface {
            display: none; 
            width: 100%; height: 100%;
            position: relative;
        }

        #map { width: 100%; height: 100%; background: #eee; }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 15px !important;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2) !important;
            padding: 0 !important;
            overflow: hidden;
            width: 280px !important;
        }
        .leaflet-popup-content { margin: 0 !important; }
        
        .popup-inner {
            display: flex; flex-direction: column;
        }
        
        .popup-img {
            width: 100%; height: 150px; object-fit: cover;
        }
        
        .popup-info {
            padding: 15px; background: white;
        }
        
        .popup-title { font-size: 1.2rem; font-weight: 700; color: var(--secondary); margin-bottom: 5px; }
        .popup-desc { font-size: 0.9rem; color: #666; line-height: 1.4; margin-bottom: 15px; }
        
        .popup-btn {
            display: block; width: 100%;
            background: var(--secondary); color: white;
            text-align: center; padding: 10px;
            border-radius: 8px; text-decoration: none;
            font-weight: 600; font-size: 0.9rem;
            transition: background 0.3s;
        }
        .popup-btn:hover { background: var(--primary); }

        /* Search Bar Overlay */
        .search-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            z-index: 1000;
            background: white;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 10px 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .search-input {
            flex-grow: 1; border: none; outline: none; font-size: 1rem; color: #333;
        }
    </style>
</head>
<body>

    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="earth-container">
            <div class="earth"></div>
        </div>
        <h1 class="logo-text">VOYA</h1>
        <p class="subtitle">Открой мир для себя</p>
        <button class="btn-start" onclick="enterApp()">НАЧАТЬ ПУТЕШЕСТВИЕ</button>
    </div>

    <!-- 2. MAIN APP -->
    <div id="app-interface">
        <!-- Map Container -->
        <div id="map"></div>

        <!-- Search Bar -->
        <div class="search-overlay">
            <span style="font-size:1.2rem;">🔍</span>
            <input type="text" class="search-input" placeholder="Куда хочешь поехать?" onkeyup="handleSearch(event)">
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Data Base with Images
        const cities = [
            { 
                name: "Москва", country: "Россия", lat: 55.75, lng: 37.61, 
                desc: "Столица с Кремлем, Красной площадью и ночной жизнью.",
                img: "https://images.unsplash.com/photo-1513326738677-b964603b136d?auto=format&fit=crop&w=800&q=80"
            },
            { 
                name: "Санкт-Петербург", country: "Россия", lat: 59.93, lng: 30.33, 
                desc: "Северная Венеция, Эрмитаж и разводные мосты.",
                img: "https://images.unsplash.com/photo-1556610961-95eba5aad991?auto=format&fit=crop&w=800&q=80"
            },
            { 
                name: "Париж", country: "Франция", lat: 48.85, lng: 2.35, 
                desc: "Город любви, Эйфелева башня и лучшие круассаны.",
                img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80"
            },
            { 
                name: "Токио", country: "Япония", lat: 35.68, lng: 139.69, 
                desc: "Киберпанк реальность, храмы и суши.",
                img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=800&q=80"
            },
            { 
                name: "Нью-Йорк", country: "США", lat: 40.71, lng: -74.00, 
                desc: "Большое яблоко, Таймс-сквер и Статуя Свободы.",
                img: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=800&q=80"
            },
            { 
                name: "Дубай", country: "ОАЭ", lat: 25.20, lng: 55.27, 
                desc: "Роскошь пустыни, небоскребы и золотые рынки.",
                img: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=800&q=80"
            },
             { 
                name: "Рим", country: "Италия", lat: 41.90, lng: 12.49, 
                desc: "Колизей, Ватикан и настоящая паста.",
                img: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=800&q=80"
            }
        ];

        let map, markersLayer;

        function enterApp() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-interface').style.display = 'block';
                initMap();
            }, 800);
        }

        function initMap() {
            // Light Theme Map (CartoDB Positron)
            map = L.map('map').setView([20, 0], 2);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
            }).addTo(map);

            renderMarkers(cities);
        }

        function renderMarkers(dataList) {
            if(markersLayer) map.removeLayer(markersLayer);
            markersLayer = L.layerGroup().addTo(map);

            dataList.forEach(city => {
                // Standard Red Pin Icon
                const marker = L.marker([city.lat, city.lng]).addTo(markersLayer);
                
                // Create Rich Popup Content
                const popupContent = `
                    <div class="popup-inner">
                        <img src="${city.img}" alt="${city.name}" class="popup-img">
                        <div class="popup-info">
                            <h3 class="popup-title">${city.name}</h3>
                            <p class="popup-desc">${city.desc}</p>
                            <a href="#" onclick="buildRoute(${city.lat}, ${city.lng}); return false;" class="popup-btn">🚀 Построить маршрут</a>
                        </div>
                    </div>
                `;
                
                marker.bindPopup(popupContent, { maxWidth: 300, minWidth: 280 });
            });
        }

        function buildRoute(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
        }

        function handleSearch(e) {
            if(e.key === 'Enter') {
                const query = e.target.value.toLowerCase().trim();
                if(!query) return renderMarkers(cities);

                const filtered = cities.filter(c => c.name.toLowerCase().includes(query));
                renderMarkers(filtered);
                
                if(filtered.length > 0) {
                     // Zoom to first result
                     const first = filtered[0];
                     map.flyTo([first.lat, first.lng], 10);
                } else {
                    alert("Не нашел такой город в списке.");
                }
            }
        }
    </script>
</body>
</html>
